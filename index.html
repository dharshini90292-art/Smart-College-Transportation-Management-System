<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Transport Management - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-selection-page">

  <div class="login-page-container">

    <!-- Welcome Section (Heading + College Bus Image) -->
    <header class="welcome-section">
      <h1 class="welcome-heading">Welcome to Smart Transport Management</h1>
      <img src="bus.png" alt="College Transit Bus" class="welcome-bus-img">
    </header>

    <!-- Three Login Boxes in One Horizontal Row -->
    <main class="login-boxes-wrapper">

      <!-- Box 1: Driver Login -->
      <div class="login-box">
        <h2 class="login-box-title">Driver Login</h2>
        <a href="driver-login.html" class="login-box-btn">Login</a>
      </div>

      <!-- Box 2: Student Login -->
      <div class="login-box">
        <h2 class="login-box-title">Student Login</h2>
        <a href="student-login.html" class="login-box-btn">Login</a>
      </div>

      <!-- Box 3: Management Login -->
      <div class="login-box">
        <h2 class="login-box-title">Management Login</h2>
        <a href="management-login.html" class="login-box-btn">Login</a>
      </div>

    </main>

  </div>

</body>
</html>
